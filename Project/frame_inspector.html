<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Frame Inspector Contact Sheet</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .card { background: #222; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
    .card img { width: 100%; height: auto; display: block; }
    .card .info { padding: 6px 10px; font-size: 13px; font-weight: bold; color: #d6b66b; }
  </style>
</head>
<body>
  <h1>825 Frame Sequence Inspector</h1>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById('grid');
    // Sample frames every 15 frames from 1 to 825, plus key boundaries
    const frames = [];
    for (let i = 1; i <= 825; i += 15) {
      frames.push(i);
    }
    if (!frames.includes(825)) frames.push(825);
    
    frames.forEach(f => {
      const card = document.createElement('div');
      card.className = 'card';
      const numStr = String(f).padStart(4, '0');
      card.innerHTML = `
        <img src="public/frames/frame_${numStr}.jpg" loading="lazy" alt="Frame ${f}">
        <div class="info">Frame #${f} (${numStr})</div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
